name: Publish Native Preview

on:
  push:
    tags:
      - "native-preview-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Native Preview tag，例如 native-preview-v0.1.0。
        required: true
        type: string
      ref:
        description: 要构建的 branch、tag 或 commit；留空时使用 tag。
        required: false
        type: string
      promote:
        description: smoke 通过后发布版本并提升到 Native Preview 更新通道。
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build signed Native Preview
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.release_ref.outputs.tag }}
      ref: ${{ steps.release_ref.outputs.ref }}
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      LILIA_NATIVE_UPDATER_PUBKEY: ${{ vars.LILIA_NATIVE_UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.LILIA_NATIVE_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.LILIA_NATIVE_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Resolve release ref
        id: release_ref
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
            $ref = "${{ inputs.ref }}"
          } else {
            $ref = $tag
          }
          if (-not $ref) { $ref = $tag }
          if (-not $tag.StartsWith("native-preview-v")) {
            throw "Native Preview tag must start with native-preview-v."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "ref=$ref" >> $env:GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ steps.release_ref.outputs.ref }}

      - name: Set up Node.js and Yarn
        uses: sena-nana/LiliaUI/.github/actions/setup-node-yarn@8cdf9fce6f86b903a475ac852bce0627f237baf5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Validate signing configuration
        shell: pwsh
        run: |
          if (-not $env:LILIA_NATIVE_UPDATER_PUBKEY) {
            throw "Set repository variable LILIA_NATIVE_UPDATER_PUBKEY."
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "Set secret LILIA_NATIVE_SIGNING_PRIVATE_KEY."
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw "Set secret LILIA_NATIVE_SIGNING_PRIVATE_KEY_PASSWORD."
          }

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Verify Native workspace
        run: corepack yarn verify:native-desktop

      - name: Build installer and updater assets
        shell: pwsh
        run: pwsh -NoProfile -File scripts/build-native-preview-release.ps1 -Tag "${{ steps.release_ref.outputs.tag }}"

      - name: Create draft Preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.release_ref.outputs.tag }}"
          $assets = Get-ChildItem "artifacts/native-preview/*/*" -File | ForEach-Object { $_.FullName }
          if (-not $assets) { throw "Native Preview release produced no assets." }
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (-not $release.isDraft) {
              throw "Refusing to replace assets on published Native Preview release $tag."
            }
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --draft --generate-notes --title "LiliaCode Native Preview $tag"
          }

      - name: Verify independent updater assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = gh release view "${{ steps.release_ref.outputs.tag }}" --json assets | ConvertFrom-Json
          $names = @($release.assets | ForEach-Object { $_.name })
          foreach ($pattern in @(
            "LiliaCodeNativePreview_*_x64-setup.exe",
            "LiliaCodeNativePreview_*_x64-setup.exe.nsis.zip",
            "LiliaCodeNativePreview_*_x64-setup.exe.nsis.zip.sig",
            "latest-native-preview.json"
          )) {
            if (-not ($names | Where-Object { $_ -like $pattern })) {
              throw "Native Preview release is missing asset pattern: $pattern"
            }
          }

      - name: Show sccache stats
        shell: pwsh
        run: "& $env:SCCACHE_PATH --show-stats"

  smoke:
    name: Smoke Native Preview installer
    needs: build
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.ref }}

      - name: Set up Node.js and Yarn
        uses: sena-nana/LiliaUI/.github/actions/setup-node-yarn@8cdf9fce6f86b903a475ac852bce0627f237baf5

      - name: Run install, CLI, single-instance and uninstall smoke
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: corepack yarn native:release:smoke:windows --tag ${{ needs.build.outputs.tag }}

  promote:
    name: Promote Native Preview channel
    needs: [build, smoke]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote }}
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Publish versioned release and floating channel manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ needs.build.outputs.tag }}"
          gh release edit $tag --draft=false --prerelease
          $channelDir = Join-Path $env:RUNNER_TEMP "native-preview-channel"
          New-Item -ItemType Directory -Force -Path $channelDir | Out-Null
          gh release download $tag --pattern "latest-native-preview.json" --dir $channelDir --clobber
          gh release view native-preview *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create native-preview --prerelease --title "LiliaCode Native Preview Update Channel" --notes "Floating manifest for the signed Native Preview channel."
          }
          gh release upload native-preview (Join-Path $channelDir "latest-native-preview.json") --clobber
