name: Publish Windows Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.0.
        required: true
        type: string
      ref:
        description: Branch, tag, or commit to build; defaults to the tag.
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Build, publish, and smoke Windows release
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      LILIA_UPDATER_PUBKEY: ${{ vars.LILIA_UPDATER_PUBKEY }}
      LILIA_UPDATER_BASE_URL: ${{ vars.LILIA_UPDATER_BASE_URL }}
      LILIA_SIGNING_PRIVATE_KEY: ${{ secrets.LILIA_SIGNING_PRIVATE_KEY }}
      LILIA_SIGNING_PASSWORD: ${{ secrets.LILIA_SIGNING_PASSWORD }}

    steps:
      - name: Resolve release input
        id: release
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ref = $tag
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
            $ref = "${{ inputs.ref }}"
          }
          if (-not $ref) { $ref = $tag }
          if ($tag -notmatch '^v.+') { throw "Release tag must start with v." }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "ref=$ref" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ steps.release.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2

      - name: Validate signing configuration
        shell: pwsh
        run: |
          if (-not $env:LILIA_UPDATER_PUBKEY) { throw "Set LILIA_UPDATER_PUBKEY." }
          if (-not $env:LILIA_UPDATER_BASE_URL) { throw "Set LILIA_UPDATER_BASE_URL." }
          if (-not $env:LILIA_SIGNING_PRIVATE_KEY) { throw "Set LILIA_SIGNING_PRIVATE_KEY." }

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - run: cargo xtask release windows --tag "${{ steps.release.outputs.tag }}"

      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $assets = Get-ChildItem artifacts/windows -Recurse -File | ForEach-Object { $_.FullName }
          if (-not $assets) { throw "Windows release produced no assets." }
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (-not $release.isDraft) { throw "Refusing to replace assets on published release $tag." }
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --draft --generate-notes --title "LiliaCode $tag"
          }

      - run: cargo xtask installer-smoke --tag "${{ steps.release.outputs.tag }}"
