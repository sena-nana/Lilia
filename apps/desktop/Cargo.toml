[package]
name = "lilia-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "liliacode"
path = "src/main.rs"

[lib]
name = "liliacode_host"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
arboard = "3.6.1"
base64 = "0.22.1"
fs2 = "0.4.3"
libloading = "0.9.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
keyring = "4.1.2"
lilia-contracts = { workspace = true }
lilia-desktop-application = { workspace = true }
lilia-agent-integration = { workspace = true }
lilia-storage = { workspace = true }
minisign-verify = "0.2.5"
mutsuki-agent-contracts = { workspace = true }
nana-ui = { git = "https://github.com/sena-nana/NanaUI.git", rev = "bdc537d7fd31b1c29a3611ad7b023e1b891a7534", features = ["bundled-fonts", "charts", "controls", "diagrams", "graph-canvas", "hosted", "image-viewer", "math", "overlays", "popover", "qr-code", "rich-text", "selects", "settings-components", "surfaces", "syntax-highlighting"] }
nana-ui-platform = { git = "https://github.com/sena-nana/NanaUI.git", rev = "bdc537d7fd31b1c29a3611ad7b023e1b891a7534", package = "nana-ui-platform" }
rfd = "0.17.2"
reqwest = { workspace = true }
rusqlite = { workspace = true }
semver = "1.0.28"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
global-hotkey = "0.8.0"
tray-icon = { version = "0.24.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSGeometry", "objc2-core-foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
global-hotkey = "0.8.0"
gtk = "0.18.2"
tray-icon = { version = "0.24.2", default-features = false, features = ["gtk"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
