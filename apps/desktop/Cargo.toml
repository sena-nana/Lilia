[package]
name = "lilia-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "liliacode"
path = "src/main.rs"

[lib]
name = "liliacode_host"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
arboard = "3.6.1"
base64 = "0.22.1"
fs2 = "0.4.3"
iced = { git = "https://github.com/sena-nana/iced.git", rev = "31bde4e4bac6de08f5ba581a8ea9c55ad0031e67", default-features = false, features = ["wgpu", "canvas", "image", "svg", "advanced", "smol", "thread-pool", "x11", "wayland"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
keyring = "4.1.2"
lilia-contracts = { workspace = true }
lilia-desktop-application = { workspace = true }
lilia-agent-integration = { workspace = true }
lilia-storage = { workspace = true }
minisign-verify = "0.2.5"
mutsuki-agent-contracts = { workspace = true }
nana-ui = { git = "https://github.com/sena-nana/NanaUI.git", rev = "6775c1fd133d4aca45ceacdbb5bfd4e3b1a7c73e", features = ["browser", "bundled-fonts", "charts", "controls", "diagrams", "graph-canvas", "hosted", "image-viewer", "math", "overlays", "popover", "qr-code", "rich-text", "selects", "settings-components", "surfaces", "syntax-highlighting"] }
rfd = "0.17.2"
reqwest = { workspace = true }
rusqlite = { workspace = true }
semver = "1.0.28"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

# The pinned Iced runtime fixes this Web API generation as one unit. Keeping the
# same constraint here lets the workspace resolver converge with reqwest's
# broader web-sys range instead of selecting a newer incompatible generation.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = "=0.3.85"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
global-hotkey = "0.8.0"
tray-icon = { version = "0.24.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
global-hotkey = "0.8.0"
gtk = "0.18.2"
tray-icon = { version = "0.24.2", default-features = false, features = ["gtk"] }

[target.'cfg(windows)'.dependencies]
libloading = "0.9.0"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
