[package]
name = "lilia-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "liliacode"
path = "src/main.rs"

[lib]
name = "liliacode_host"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
fs2 = "0.4.3"
libloading = "0.9.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
ignore = "0.4.26"
notify = "6.1.1"
thiserror = { workspace = true }
tempfile = { workspace = true }
portable-pty = { workspace = true }
vt100 = { workspace = true }
mutsuki-runtime-contracts = { workspace = true }
mutsuki-runtime-host = { workspace = true }
mutsuki-runtime-sdk = { workspace = true }
lilia-contracts = { workspace = true }
lilia-feature-agent-session = { workspace = true }
lilia-feature-composer = { workspace = true }
lilia-feature-architecture = { workspace = true }
lilia-feature-automation = { workspace = true }
lilia-feature-memory = { workspace = true }
lilia-feature-project = { workspace = true }
lilia-feature-roadmap = { workspace = true }
lilia-feature-task = { workspace = true }
lilia-feature-terminal = { workspace = true }
lilia-feature-timeline = { workspace = true }
lilia-feature-coding = { workspace = true }
lilia-feature-document = { workspace = true }
lilia-feature-extensions = { workspace = true }
lilia-feature-github = { workspace = true }
lilia-feature-import = { workspace = true }
lilia-feature-hooks = { workspace = true }
lilia-feature-provider = { workspace = true }
lilia-feature-suggestions = { workspace = true }
lilia-feature-remote = { workspace = true }
lilia-feature-update = { workspace = true }
lilia-feature-usage = { workspace = true }
lilia-feature-worktree = { workspace = true }
lilia-feature-workspace = { workspace = true }
lilia-service = { workspace = true }
lilia-kernel = { workspace = true }
lilia-agent = { workspace = true }
lilia-platform = { workspace = true }
lilia-storage = { workspace = true }
minisign-verify = "0.2.5"
mutsuki-agent-contracts = { workspace = true }
nana-ui = { git = "https://github.com/sena-nana/NanaUI.git", rev = "14932f173510b43feed7511e7310dec988ee7c88", features = ["full"] }
nana-ui-platform = { git = "https://github.com/sena-nana/NanaUI.git", rev = "14932f173510b43feed7511e7310dec988ee7c88", package = "nana-ui-platform" }
reqwest = { workspace = true, features = ["form", "query"] }
rusqlite = { workspace = true, features = ["backup"] }
semver = "1.0.28"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
global-hotkey = "0.8.0"
tray-icon = { version = "0.24.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSGeometry", "objc2-core-foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
global-hotkey = "0.8.0"
gtk = "0.18.2"
tray-icon = { version = "0.24.2", default-features = false, features = ["gtk"] }

[build-dependencies]
winresource = "0.1.17"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
