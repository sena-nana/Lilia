[package]
name = "lilia-cli"
description = "Minimal Host-neutral CLI via shared LiliaClient / ServiceAuthority (#58 / #60)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lilia-cli"
path = "src/main.rs"

[lib]
name = "lilia_cli"
path = "src/lib.rs"

[dependencies]
lilia-agent-integration = { workspace = true }
lilia-client = { workspace = true }
lilia-contracts = { workspace = true }
lilia-core = { workspace = true }
lilia-service = { workspace = true }
lilia-storage = { workspace = true }
mutsuki-agent-contracts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
rusqlite = { workspace = true }
