[workspace]
resolver = "2"
members = [
    "crates/lilia-contracts",
    "crates/lilia-kernel",
    "crates/lilia-platform",
    "crates/lilia-core",
    "crates/lilia-client",
    "crates/lilia-storage",
    "crates/lilia-agent",
    "crates/lilia-service",
    "crates/features/lilia-feature-agent-session",
    "crates/features/lilia-feature-architecture",
    "crates/features/lilia-feature-automation",
    "crates/features/lilia-feature-coding",
    "crates/features/lilia-feature-composer",
    "crates/features/lilia-feature-document",
    "crates/features/lilia-feature-extensions",
    "crates/features/lilia-feature-github",
    "crates/features/lilia-feature-import",
    "crates/features/lilia-feature-hooks",
    "crates/features/lilia-feature-memory",
    "crates/features/lilia-feature-project",
    "crates/features/lilia-feature-provider",
    "crates/features/lilia-feature-roadmap",
    "crates/features/lilia-feature-suggestions",
    "crates/features/lilia-feature-task",
    "crates/features/lilia-feature-terminal",
    "crates/features/lilia-feature-timeline",
    "crates/features/lilia-feature-remote",
    "crates/features/lilia-feature-update",
    "crates/features/lilia-feature-usage",
    "crates/features/lilia-feature-worktree",
    "crates/features/lilia-feature-workspace",
    "apps/service",
    "apps/desktop",
    "xtask",
]
default-members = ["apps/desktop"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0"
uuid = { version = "1.23.4", features = ["v4"] }
url = "2.5.8"
lilia-contracts = { path = "crates/lilia-contracts" }
lilia-kernel = { path = "crates/lilia-kernel" }
lilia-platform = { path = "crates/lilia-platform" }
lilia-core = { path = "crates/lilia-core" }
lilia-client = { path = "crates/lilia-client" }
lilia-storage = { path = "crates/lilia-storage" }
lilia-agent = { path = "crates/lilia-agent" }
lilia-service = { path = "crates/lilia-service" }
lilia-feature-agent-session = { path = "crates/features/lilia-feature-agent-session" }
lilia-feature-architecture = { path = "crates/features/lilia-feature-architecture" }
lilia-feature-automation = { path = "crates/features/lilia-feature-automation" }
lilia-feature-coding = { path = "crates/features/lilia-feature-coding" }
lilia-feature-composer = { path = "crates/features/lilia-feature-composer" }
lilia-feature-document = { path = "crates/features/lilia-feature-document" }
lilia-feature-extensions = { path = "crates/features/lilia-feature-extensions" }
lilia-feature-github = { path = "crates/features/lilia-feature-github" }
lilia-feature-import = { path = "crates/features/lilia-feature-import" }
lilia-feature-hooks = { path = "crates/features/lilia-feature-hooks" }
lilia-feature-memory = { path = "crates/features/lilia-feature-memory" }
lilia-feature-project = { path = "crates/features/lilia-feature-project" }
lilia-feature-provider = { path = "crates/features/lilia-feature-provider" }
lilia-feature-roadmap = { path = "crates/features/lilia-feature-roadmap" }
lilia-feature-suggestions = { path = "crates/features/lilia-feature-suggestions" }
lilia-feature-task = { path = "crates/features/lilia-feature-task" }
lilia-feature-terminal = { path = "crates/features/lilia-feature-terminal" }
lilia-feature-timeline = { path = "crates/features/lilia-feature-timeline" }
lilia-feature-remote = { path = "crates/features/lilia-feature-remote" }
lilia-feature-update = { path = "crates/features/lilia-feature-update" }
lilia-feature-usage = { path = "crates/features/lilia-feature-usage" }
lilia-feature-worktree = { path = "crates/features/lilia-feature-worktree" }
lilia-feature-workspace = { path = "crates/features/lilia-feature-workspace" }
# Mutsuki pin mode: PATH (sibling checkout) vs GIT (release rev).
# See docs/design/mutsuki-dependency-pin.md — switch all entries together.
# GIT mode (default): pin https://github.com/sena-nana/Mutsuki.git @ 51f23c1056ea1f34ce1e4b944e88f1ff940eca35
mutsuki-runtime-contracts = { git = "https://github.com/sena-nana/Mutsuki.git", rev = "51f23c1056ea1f34ce1e4b944e88f1ff940eca35", package = "mutsuki-runtime-contracts" }
mutsuki-runtime-core = { git = "https://github.com/sena-nana/Mutsuki.git", rev = "51f23c1056ea1f34ce1e4b944e88f1ff940eca35", package = "mutsuki-runtime-core" }
mutsuki-runtime-host = { git = "https://github.com/sena-nana/Mutsuki.git", rev = "51f23c1056ea1f34ce1e4b944e88f1ff940eca35", package = "mutsuki-runtime-host" }
mutsuki-runtime-sdk = { git = "https://github.com/sena-nana/Mutsuki.git", rev = "51f23c1056ea1f34ce1e4b944e88f1ff940eca35", package = "mutsuki-runtime-sdk" }
mutsuki-agent-adapter-api = { git = "https://github.com/sena-nana/Mutsuki.git", rev = "51f23c1056ea1f34ce1e4b944e88f1ff940eca35", package = "mutsuki-agent-adapter-api" }
mutsuki-agent-adapter-anthropic = { git = "https://github.com/sena-nana/Mutsuki.git", rev = "51f23c1056ea1f34ce1e4b944e88f1ff940eca35", package = "mutsuki-agent-adapter-anthropic" }
mutsuki-agent-adapter-openai = { git = "https://github.com/sena-nana/Mutsuki.git", rev = "51f23c1056ea1f34ce1e4b944e88f1ff940eca35", package = "mutsuki-agent-adapter-openai" }
mutsuki-agent-bundle = { git = "https://github.com/sena-nana/Mutsuki.git", rev = "51f23c1056ea1f34ce1e4b944e88f1ff940eca35", package = "mutsuki-agent-bundle" }
mutsuki-agent-client = { git = "https://github.com/sena-nana/Mutsuki.git", rev = "51f23c1056ea1f34ce1e4b944e88f1ff940eca35", package = "mutsuki-agent-client" }
mutsuki-agent-contracts = { git = "https://github.com/sena-nana/Mutsuki.git", rev = "51f23c1056ea1f34ce1e4b944e88f1ff940eca35", package = "mutsuki-agent-contracts" }
mutsuki-agent-plugin-code-index = { git = "https://github.com/sena-nana/Mutsuki.git", rev = "51f23c1056ea1f34ce1e4b944e88f1ff940eca35", package = "mutsuki-agent-plugin-code-index" }
mutsuki-agent-plugin-computer-use = { git = "https://github.com/sena-nana/Mutsuki.git", rev = "51f23c1056ea1f34ce1e4b944e88f1ff940eca35", package = "mutsuki-agent-plugin-computer-use" }
mutsuki-agent-plugin-git = { git = "https://github.com/sena-nana/Mutsuki.git", rev = "51f23c1056ea1f34ce1e4b944e88f1ff940eca35", package = "mutsuki-agent-plugin-git" }
mutsuki-agent-plugin-lsp = { git = "https://github.com/sena-nana/Mutsuki.git", rev = "51f23c1056ea1f34ce1e4b944e88f1ff940eca35", package = "mutsuki-agent-plugin-lsp" }
mutsuki-agent-plugin-mcp = { git = "https://github.com/sena-nana/Mutsuki.git", rev = "51f23c1056ea1f34ce1e4b944e88f1ff940eca35", package = "mutsuki-agent-plugin-mcp" }
mutsuki-agent-runtime = { git = "https://github.com/sena-nana/Mutsuki.git", rev = "51f23c1056ea1f34ce1e4b944e88f1ff940eca35", package = "mutsuki-agent-runtime" }
mutsuki-agent-sdk = { git = "https://github.com/sena-nana/Mutsuki.git", rev = "51f23c1056ea1f34ce1e4b944e88f1ff940eca35", package = "mutsuki-agent-sdk" }
mutsuki-agent-testkit = { git = "https://github.com/sena-nana/Mutsuki.git", rev = "51f23c1056ea1f34ce1e4b944e88f1ff940eca35", package = "mutsuki-agent-testkit" }
mutsuki-plugin-agent-memory-router = { git = "https://github.com/sena-nana/Mutsuki.git", rev = "51f23c1056ea1f34ce1e4b944e88f1ff940eca35", package = "mutsuki-plugin-agent-memory-router" }
# PATH mode (local sibling; comment GIT block above, uncomment all together):
# mutsuki-runtime-contracts = { path = "../MutsukiCore/crates/mutsuki-runtime-contracts" }
# mutsuki-agent-adapter-anthropic = { path = "../MutsukiCore/kits/agent/crates/mutsuki-agent-adapter-anthropic" }
# …mirror every mutsuki-* entry to the same sibling path…
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "io-util"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.39", features = ["bundled"] }
portable-pty = "0.9.0"
vt100 = "0.16.2"

[profile.dev]
debug = "line-tables-only"
incremental = true
codegen-units = 256

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
incremental = false
